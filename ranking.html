function buildTable(data,gender){
  var hd=gender==='male'?'male-hd':'female-hd';
  if(data.length===0){
    return '<div class="no-result">該当する選手が見つかりません</div>';
  }
  var s='<table><thead class="'+hd+'"><tr><th style="width:52px">順位</th><th>氏名</th><th class="pts">公式pt</th><th class="pts">GSエントリーpt</th></tr></thead><tbody>';
  data.forEach(function(p){
    var i=(gender==='male'?MALE:FEMALE).indexOf(p);
    var b=p.fz?('<span class="badge">'+(p.ft==='maternity'?'産休':'怪我')+'</span>'):'';
    s+='<tr><td class="rk">'+p.r+'</td>'
     +'<td><button class="bl bn" onclick="sGs('+i+',\''+gender+'\')">'+p.n+'</button>'+b+'</td>'
     +'<td class="pts"><button class="bl bp" onclick="sOff('+i+',\''+gender+'\')">'+p.o.toLocaleString()+'</button></td>'
     +'<td class="pts">'+p.g.toLocaleString()+'</td></tr>';
  });
  return s+'</tbody></table>';
}
var currentSearch='';
function normalizeName(s){
  // 全角スペース・半角スペースを除去して比較しやすくする
  return s.replace(/[\s\u3000]/g,'').toLowerCase();
}
function filteredData(gender){
  var data=gender==='male'?MALE:FEMALE;
  if(!currentSearch) return data;
  var q=normalizeName(currentSearch);
  return data.filter(function(p){ return normalizeName(p.n).indexOf(q)!==-1; });
}
function renderTab(gender){
  document.getElementById(gender+'-w').innerHTML=buildTable(filteredData(gender),gender);
}
function onSearchInput(val){
  currentSearch=val;
  document.getElementById('searchClear').classList.toggle('show', !!val);
  renderTab('male');
  renderTab('female');
  if(val){
    var mCount=filteredData('male').length, fCount=filteredData('female').length;
    var activeGender=document.getElementById('male').classList.contains('active')?'male':'female';
    var otherGender=activeGender==='male'?'female':'male';
    var otherCount=activeGender==='male'?fCount:mCount;
    var hint=(activeGender==='male'?mCount:fCount)+'件ヒット';
    if(otherCount>0){
      hint+='（'+(otherGender==='male'?'男子':'女子')+'にも'+otherCount+'件あります）';
    }
    document.getElementById('searchHint').textContent=hint;
  } else {
    document.getElementById('searchHint').textContent='';
  }
}
function clearSearch(){
  document.getElementById('searchBox').value='';
  onSearchInput('');
  document.getElementById('searchBox').focus();
}
function showTab(id,btn){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('male-active','female-active')});
  document.getElementById(id).classList.add('active');
  btn.classList.add(id==='male'?'male-active':'female-active');
  var w=document.getElementById(id+'-w');
  if(!w.innerHTML || currentSearch) renderTab(id);
}
function sOff(idx,g){
  var p=(g==='male'?MALE:FEMALE)[idx];
  document.getElementById('off-t').textContent=p.n+' — 公式ポイント内訳';
  document.getElementById('off-tot').textContent=p.o.toLocaleString()+' pt';
  document.getElementById('off-m').style.display=p.m?'block':'none';
  var rows='';
  p.ob.forEach(function(r){
    var cl=r.dl<=28?'er':r.dl<=56?'eo':'';
    var tag=r.dl<=28?'<br><span class="tr">⚠️ まもなく期限切れ</span>':r.dl<=56?'<br><span class="to">△ 2ヶ月以内</span>':'';
    rows+='<tr class="'+cl+'"><td>'+r.d+'</td><td class="r" style="font-weight:600">'+r.p.toLocaleString()+'</td><td class="r" style="font-size:12px;color:#666">'+r.e+'まで'+tag+'</td></tr>';
  });
  document.getElementById('off-bd').innerHTML=rows||'<tr><td colspan="3" style="color:#999;text-align:center;padding:12px">データなし</td></tr>';
  document.getElementById('ov-off').classList.add('open');
}
function sGs(idx,g){
  var p=(g==='male'?MALE:FEMALE)[idx];
  document.getElementById('gs-t').textContent=p.n+' — GS内訳';
  document.getElementById('gs-o').textContent=p.o.toLocaleString()+' pt';
  document.getElementById('gs-g').textContent=p.g.toLocaleString()+' pt';
  var html='';
  p.gh.forEach(function(h){
    var ex=h.dl<=28?'<span class="tr"> ⚠️</span>':h.dl<=56?'<span class="to"> △</span>':'';
    var cl=h.c?'gb3':h.r4?'gr4':'';
    var lb=h.c?'<span style="font-size:10px;font-weight:600;color:#2e7d32">✓ベスト3</span>'
           :h.r4?'<span style="font-size:10px;font-weight:600;color:#1565c0">直近4</span>'
           :'<span style="color:#ccc;font-size:10px">−</span>';
    html+='<div style="display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid #eee;align-items:center" class="'+cl+'">'
         +'<span style="color:#666;font-size:12px;width:88px;flex-shrink:0">'+h.d+ex+'</span>'
         +'<span style="font-weight:700;min-width:70px">'+h.p.toLocaleString()+' pt</span>'
         +lb
         +'<span style="font-size:11px;color:#aaa;margin-left:auto">'+h.e+'まで</span></div>';
  });
  document.getElementById('gs-list').innerHTML=html||'<div style="color:#999;font-size:13px;padding:8px 0">データなし</div>';
  document.getElementById('ov-gs').classList.add('open');
}
function cOff(){document.getElementById('ov-off').classList.remove('open')}
function cGs(){document.getElementById('ov-gs').classList.remove('open')}
renderTab('male');
</script>
