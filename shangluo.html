<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=0.25, user-scalable=yes, minimum-scale=0.1, maximum-scale=5.0">
<title>AVC Beach Continental Championships - Shangluo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0D1B2A;
  --bg2: #1A2D42;
  --gold: #F0A500;
  --gold-light: #FFD166;
  --teal: #2EC4B6;
  --teal-dark: #1A8C85;
  --white: #FFFFFF;
  --gray: #8A9BB0;
  --gray-light: #E8EDF2;
  --text: #1A2D42;
  --jpn: #E8F4FF;
}
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  padding: 20px 16px 60px;
}

/* HEADER */
.hd { text-align:center; margin-bottom:24px; }
.hd h1 { font-family:'Barlow Condensed',cursive; font-size:clamp(22px,4vw,42px); color:var(--white); letter-spacing:2px; line-height:1.15; font-weight:800; text-transform:uppercase; }
.hd-meta { display:flex; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.hd-tag { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.88); font-size:10px; letter-spacing:2px; padding:3px 12px; border-radius:3px; font-weight:600; text-transform:uppercase; }

/* TOGGLE */
.toggle-wrap { display:flex; justify-content:center; gap:10px; margin-bottom:24px; }
.toggle-btn { font-family:'Barlow Condensed',cursive; font-size:16px; letter-spacing:3px; padding:8px 32px; border-radius:3px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.80); cursor:pointer; transition:all 0.2s; text-transform:uppercase; font-weight:700; }
.toggle-btn.active { background:var(--teal-dark); border-color:var(--teal); color:#fff; }
.toggle-btn.women-btn.active { background:#7B2D8B; border-color:#C86DD7; color:#fff; }

/* VIEW */
.view { display:none; }
.view.active { display:block; }

/* SUB TABS */
.sub-tabs { display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.sub-tab {
  font-family:'Barlow Condensed',cursive; font-size:14px; letter-spacing:2px;
  padding:6px 24px; border-radius:3px; border:1.5px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.80);
  cursor:pointer; transition:all 0.2s; text-transform:uppercase; font-weight:700;
}
.sub-tab.active { background:rgba(46,196,182,0.2); border-color:var(--teal); color:var(--teal); }
.women-mode .sub-tab.active { background:rgba(200,109,215,0.2); border-color:#C86DD7; color:#C86DD7; }
.sub-view { display:none; }
.sub-view.active { display:block; }

/* POOL PLAY */
.pools-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; margin-bottom:24px; max-width:1160px; margin-left:auto; margin-right:auto; }
.pool-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:8px; overflow:hidden; }
.pool-title { font-family:'Barlow Condensed',cursive; font-size:14px; letter-spacing:3px; font-weight:700; text-transform:uppercase; padding:8px 14px; background:rgba(46,196,182,0.15); color:var(--teal); border-bottom:1px solid rgba(46,196,182,0.2); display:flex; justify-content:space-between; align-items:center; }
.women-mode .pool-title { background:rgba(200,109,215,0.15); color:#C86DD7; border-bottom-color:rgba(200,109,215,0.2); }
.pool-title .host-tag { font-size:9px; letter-spacing:1px; background:rgba(255,255,255,0.15); padding:1px 6px; border-radius:2px; }
.pool-table { width:100%; border-collapse:collapse; font-size:12px; }
.pool-table th { padding:5px 8px; text-align:center; color:var(--gray); font-weight:600; font-size:9px; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,0.08); text-transform:uppercase; }
.pool-table th:nth-child(2) { text-align:left; }
.pool-table td { padding:7px 8px; text-align:center; color:rgba(255,255,255,0.88); border-bottom:1px solid rgba(255,255,255,0.06); font-size:12px; }
.pool-table td:nth-child(2) { text-align:left; }
.pool-table tr:last-child td { border-bottom:none; }
.rank-cell { font-family:'Barlow Condensed',cursive; font-weight:700; font-size:14px; color:var(--gray); width:22px; }
.ctry-pill { display:inline-block; font-size:9px; font-weight:700; color:#fff; background:var(--bg2); border-radius:2px; padding:2px 5px; margin-right:6px; min-width:30px; text-align:center; }
.ctry-pill.jpn { background:var(--teal-dark); }
.women-mode .ctry-pill.jpn { background:#7B2D8B; }
.ctry-pill.host { background:#B8862E; }
.seed-cell { font-size:10px; color:var(--gray); width:34px; }

/* DRAW STRUCTURE INFO */
.draw-note { max-width:760px; margin:0 auto 20px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:16px 20px; color:rgba(255,255,255,0.85); font-size:13px; line-height:1.7; }
.draw-note b { color:#fff; }
.draw-note .women-mode & { }
.draw-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; max-width:1160px; margin:0 auto; }
.draw-slot { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:10px 14px; }
.draw-slot .dno { font-family:'Barlow Condensed',cursive; font-size:12px; font-weight:700; color:var(--teal); letter-spacing:1px; }
.women-mode .draw-slot .dno { color:#C86DD7; }
.draw-slot .dtext { font-size:12px; color:rgba(255,255,255,0.85); margin-top:2px; }
.medal-row { display:flex; justify-content:center; gap:16px; margin-top:14px; }
.medal-card { background:linear-gradient(135deg,#C67E00,var(--gold-light),#C67E00); border-radius:8px; padding:14px 22px; text-align:center; color:#fff; font-family:'Barlow Condensed',cursive; letter-spacing:2px; font-weight:700; font-size:13px; }
.medal-card.bronze { background:linear-gradient(135deg,#8C5A2B,#CD9B66,#8C5A2B); }
.women-mode .medal-card { background:linear-gradient(135deg,#5B1A6A,#C86DD7,#5B1A6A); }
.women-mode .medal-card.bronze { background:linear-gradient(135deg,#6A3B5B,#C88BB0,#6A3B5B); }

/* ===== WHITE BG + GREEN OVERRIDE ===== */
body { background:#F0F2F5 !important; }
.hd h1 { color:#111 !important; }
.hd-tag { background:#fff !important; border:1px solid #CCC !important; color:#222 !important; }
.toggle-btn { background:#fff !important; border:2px solid #CCC !important; color:#222 !important; }
.sub-tab { background:#fff !important; border:1.5px solid #CCC !important; color:#333 !important; }
.pool-card { background:#fff !important; border:1px solid #DDD !important; box-shadow:0 1px 4px rgba(0,0,0,0.08) !important; }
.pool-title { background:#2EC4B6 !important; color:#fff !important; border-bottom-color:#1A8C85 !important; }
.women-mode .pool-title { background:#9B3DAF !important; border-bottom-color:#7B2D8F !important; }
.pool-table th { color:#333 !important; background:#F8F8F8 !important; }
.pool-table td { color:#2E7D32 !important; }
.rank-cell { color:#333 !important; }
.seed-cell { color:#666 !important; }
.ctry-pill { background:#666 !important; color:#fff !important; }
.ctry-pill.jpn { background:#1A8C85 !important; }
.women-mode .ctry-pill.jpn { background:#7B2D8F !important; }
.ctry-pill.host { background:#B8862E !important; }
.draw-note { background:#fff !important; border:1px solid #DDD !important; color:#333 !important; }
.draw-note b { color:#111 !important; }
.draw-slot { background:#fff !important; border:1px solid #DDD !important; }
.draw-slot .dno { color:#1A8C85 !important; }
.women-mode .draw-slot .dno { color:#7B2D8F !important; }
.draw-slot .dtext { color:#333 !important; }
/* ===== END OVERRIDE ===== */
</style>
</head>

function poolCard(poolLetter, teams){
  let rows = teams.map(function(t){
    var pill = '<span class="ctry-pill'+(t.jpn?' jpn':'')+(t.h?' host':'')+'">'+t.ctry+'</span>';
    return '<tr><td class="rank-cell">–</td><td>'+pill+t.team+'</td><td class="seed-cell">Seed '+t.seed+'</td></tr>';
  }).join('');
  var hostTag = teams.some(function(t){return t.h;}) ? '<span class="host-tag">HOST含む</span>' : '';
  return '<div class="pool-card">'
    + '<div class="pool-title">Pool '+poolLetter+hostTag+'</div>'
    + '<table class="pool-table"><thead><tr><th>順位</th><th>チーム</th><th>シード</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '</div>';
}

function renderPools(containerId, pools){
  var order = ['A','B','C','D','E','F'];
  document.getElementById(containerId).innerHTML = order.map(function(k){ return poolCard(k, pools[k]); }).join('');
}

function switchGender(g, btn){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('view-'+g).classList.add('active');
  btn.classList.add('active');
  document.getElementById('tag-gender').textContent = g==='men' ? "MEN'S" : "WOMEN'S";
  document.body.classList.toggle('women-mode', g==='women');
}

function switchTab(g, tab, btn){
  document.querySelectorAll('#sub-tabs-'+g+' .sub-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('#view-'+g+' .sub-view').forEach(function(v){v.classList.remove('active');});
  document.getElementById(g+'-'+tab).classList.add('active');
}
